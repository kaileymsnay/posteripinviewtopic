services:
    phpbbmodders.posteripinviewtopic.listener:
        class: phpbbmodders\posteripinviewtopic\event\main_listener
        arguments:
            - '@auth'
            - '@language'
            - '@template'
            - '@controller.helper'
        tags:
            - { name: event.listener }

    phpbbmodders.posteripinviewtopic.core.freegeoip:
        class: phpbbmodders\posteripinviewtopic\core\freegeoip
        arguments:
